name: Build AoT RPG mod

on:
  push:
    paths:
      - 'rpg-mod/**'
      - '.github/workflows/rpg-mod.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rpg-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Build
        run: gradle build --no-daemon --stacktrace
      - name: Check HUD mixin targets
        continue-on-error: true
        run: |
          for j in $(find ~/.gradle/caches/fabric-loom -name 'minecraft-*.jar' | grep -v sources); do
            if unzip -l "$j" | grep -q 'net/minecraft/client/gui/hud/InGameHud.class'; then
              echo "jar: $j"
              javap -p -cp "$j" net.minecraft.client.gui.hud.InGameHud | grep -iE "render(StatusBars|ExperienceBar|ExperienceLevel)"
              javap -p -cp "$j" net.minecraft.client.MinecraftClient | grep -E " hasOutline"
              javap -p -cp "$j" net.minecraft.entity.Entity | grep -E " getTeamColorValue"
              javap -p -cp "$j" net.minecraft.client.render.entity.EntityRenderer | grep -E "renderLabelIfPresent|dispatcher"
              javap -p -cp "$j" net.minecraft.client.MinecraftClient | grep -E " setScreen"
              javap -p -cp "$j" net.minecraft.client.gui.screen.ingame.InventoryScreen | grep -E "drawEntity|isClickOutsideBounds"
              javap -p -cp "$j" net.minecraft.entity.player.PlayerEntity | grep -E " dropInventory"
              javap -p -cp "$j" net.minecraft.client.network.ClientPlayerEntity | grep -E "showsDeathScreen|requestRespawn"
              javap -p -cp "$j" net.minecraft.client.render.block.entity.BeaconBlockEntityRenderer | grep -E "renderBeam|BEAM_TEXTURE"
              javap -p -cp "$j" net.minecraft.client.gui.hud.InGameHud | grep -E "renderHotbar|renderHotbarItem"
              javap -p -cp "$j" net.minecraft.client.gui.DrawContext | grep -E "drawItemInSlot"
              javap -p -cp "$j" net.minecraft.world.World | grep -E " setBlockState"
              javap -p -cp "$j" net.minecraft.server.world.ServerWorld | grep -E " tickEntity"
              javap -p -cp "$j" net.minecraft.server.command.CommandManager | grep -E " execute"
              javap -p -cp "$j" net.minecraft.item.BlockItem | grep -E " place"
              javap -p -cp "$j" net.minecraft.block.entity.BlockEntity | grep -E " (read|createNbt)\("
              break
            fi
          done
          grep -iE "mixin|refmap|Cannot find" -r build/tmp 2>/dev/null | head -20 || true
      - uses: actions/upload-artifact@v4
        with:
          name: aot-rpg-mod
          path: rpg-mod/build/libs/aot-rpg-*.jar
          if-no-files-found: error
      - name: Put the jar in dist/
        run: |
          jar=$(ls build/libs/aot-rpg-*.jar | grep -v sources | head -1)
          cp "$jar" ../dist/aot-rpg.jar
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/aot-rpg.jar
          git diff --cached --quiet || { git commit -m "Update dist/aot-rpg.jar [skip ci]" && git push; }
