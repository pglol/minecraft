name: Build AoT RPG mod

on:
  push:
    paths:
      - 'rpg-mod/**'
      - '.github/workflows/rpg-mod.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rpg-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Build
        run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: aot-rpg-mod
          path: rpg-mod/build/libs/aot-rpg-*.jar
          if-no-files-found: error
